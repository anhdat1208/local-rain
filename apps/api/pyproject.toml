[project]
name = "local-rain-api"
version = "0.1.0"
description = "Local Rain FastAPI backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6",
  "redis==5.2.1",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "httpx==0.28.1",
  "Pillow==11.2.1",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
